services:
  mongo:
    image: mongo:7.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      retries: 40
  spark-master:
    build: .
    hostname: spark-master
    command: ["/usr/local/lib/python3.10/dist-packages/pyspark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
  spark-worker-1:
    build: .
    hostname: spark-worker-1
    command: ["/usr/local/lib/python3.10/dist-packages/pyspark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "1", "--memory", "2g", "spark://spark-master:7077"]
    volumes: [".:/workspace"]
    depends_on: [spark-master]
  spark-worker-2:
    build: .
    hostname: spark-worker-2
    command: ["/usr/local/lib/python3.10/dist-packages/pyspark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "1", "--memory", "2g", "spark://spark-master:7077"]
    volumes: [".:/workspace"]
    depends_on: [spark-master]
  lab:
    build: .
    hostname: lab
    volumes: [".:/workspace"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      KAFKA_BOOTSTRAP: kafka:9092
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: lab
      PYSPARK_SUBMIT_ARGS: --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7 pyspark-shell
    depends_on:
      mongo: {condition: service_healthy}
      kafka: {condition: service_healthy}
      spark-worker-1: {condition: service_started}
      spark-worker-2: {condition: service_started}
